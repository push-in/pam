<text x="504" y="492" font-size="13" font-weight="600" fill="#1f2328">Android Views · UIKit</text>
<text x="504" y="512" font-size="11.5" fill="#59636e">PHP tree → Rust diff + Yoga</text>
<text x="504" y="529" font-size="11.5" fill="#59636e">→ UI-thread commit</text>
<rect x="710" y="470" width="210" height="74" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.2"/>
<text x="724" y="492" font-size="13" font-weight="600" fill="#1f2328">GTK 4 · AppKit · Win32</text>
<text x="724" y="512" font-size="11.5" fill="#59636e">PAM Desktop 2.0 preview</text>
<text x="724" y="529" font-size="11.5" fill="#59636e">no web view in the path</text>
<line x1="590" y1="436" x2="590" y2="468" stroke="#818b98" stroke-width="1.6" marker-end="url(#m)"/>
<text x="600" y="456" font-size="11" text-anchor="start" fill="#59636e">renders</text>
<line x1="815" y1="436" x2="815" y2="468" stroke="#818b98" stroke-width="1.6" marker-end="url(#m)"/>
<text x="825" y="456" font-size="11" text-anchor="start" fill="#59636e">renders</text>
<rect x="40" y="470" width="410" height="74" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.2"/>
<text x="54" y="492" font-size="13" font-weight="600" fill="#1f2328">Your PHP stays PHP</text>
<text x="54" y="512" font-size="11.5" fill="#59636e">PSR-7/15/17 · Laravel 12/13 · Pest · PHPUnit · Eloquent</text>
