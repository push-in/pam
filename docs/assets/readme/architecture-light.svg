<text x="44" y="222" font-size="13" font-weight="600" fill="#1f2328">Clients</text>
<text x="44" y="242" font-size="11.5" fill="#59636e">browsers · apps · APIs</text>
<line x1="170" y1="237" x2="278" y2="237" stroke="#818b98" stroke-width="1.6" marker-end="url(#m)"/>
<text x="224.0" y="228" font-size="11" text-anchor="middle" fill="#59636e">TCP · TLS · QUIC</text>
<rect x="280" y="168" width="270" height="152" rx="10" fill="#ddf4ff" stroke="#2a78d6" stroke-width="1.2"/>
<text x="294" y="190" font-size="13" font-weight="600" fill="#1f2328">Rust · Tokio</text>
<text x="294" y="210" font-size="11.5" fill="#59636e">HTTP/1.1 · HTTP/2 · HTTP/3</text>
<text x="294" y="227" font-size="11.5" fill="#59636e">WebSocket · Rustls TLS</text>
<text x="294" y="244" font-size="11.5" fill="#59636e">timers · sockets · async I/O</text>
<text x="294" y="261" font-size="11.5" fill="#59636e">limits · backpressure · metrics</text>
<rect x="670" y="168" width="230" height="152" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.2"/>
<text x="684" y="190" font-size="13" font-weight="600" fill="#1f2328">Zend Engine · Embed SAPI</text>
<text x="684" y="210" font-size="11.5" fill="#59636e">application booted once</text>
<text x="684" y="227" font-size="11.5" fill="#59636e">Composer autoloaded once</text>
