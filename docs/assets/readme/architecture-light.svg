<text x="855" y="279" font-size="11" text-anchor="middle" font-weight="600" fill="#1f2328">Fiber</text>
<text x="855" y="294" font-size="10" text-anchor="middle" fill="#59636e">request N</text>
<line x1="550" y1="214" x2="668" y2="214" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#a)"/>
<text x="609.0" y="206" font-size="11" text-anchor="middle" fill="#2a78d6">dispatch request</text>
<line x1="668" y1="272" x2="552" y2="272" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#a)"/>
<text x="610.0" y="264" font-size="11" text-anchor="middle" fill="#2a78d6">suspend on I/O</text>
