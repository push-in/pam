<text x="374" y="62" font-size="11.5" fill="#59636e">crash recovery · watchdog · graceful drain · generational reload</text>
<text x="374" y="79" font-size="11.5" fill="#59636e">/live · /ready · /metrics served outside PHP</text>
<line x1="290" y1="57" x2="358" y2="57" stroke="#818b98" stroke-width="1.6" marker-end="url(#m)"/>
<text x="324.0" y="51.0" font-size="11" text-anchor="middle" fill="#59636e">manages</text>
<line x1="640" y1="94" x2="640" y2="130" stroke="#818b98" stroke-width="1.6" marker-end="url(#m)"/>
<text x="652" y="116" font-size="11" text-anchor="start" fill="#59636e">supervises N workers · SO_REUSEPORT</text>
<rect x="260" y="134" width="660" height="206" rx="10" fill="none" stroke="#d1d9e0" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="274" y="156" font-size="13" font-weight="600" fill="#1f2328">Worker process</text>
