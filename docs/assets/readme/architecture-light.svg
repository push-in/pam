<text x="140" y="423" font-size="12" text-anchor="middle" fill="#1f2328">pushinbr/pam-http</text>
<rect x="250" y="400" width="200" height="36" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.2"/>
<text x="350" y="423" font-size="12" text-anchor="middle" fill="#1f2328">pam-laravel · pam-octane</text>
<rect x="490" y="400" width="200" height="36" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.2"/>
