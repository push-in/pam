<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="PAM architecture: a supervised master runs worker processes; in each worker Rust and Tokio own the network and I/O while the Zend Engine keeps the Composer application in memory and runs each request in a Fiber; Composer packages add HTTP, Laravel, Native and Desktop.">
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#818b98"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2a78d6"/></marker></defs>
<rect x="40" y="20" width="250" height="74" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.2"/>
<text x="54" y="42" font-size="13" font-weight="600" fill="#1f2328">pamd · process manager</text>
<text x="54" y="62" font-size="11.5" fill="#59636e">pam up · reload · scale · logs</text>
<text x="54" y="79" font-size="11.5" fill="#59636e">canary traffic · health checks</text>
<rect x="360" y="20" width="560" height="74" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.2"/>
