<text x="168" y="126" font-size="18" font-weight="600" fill="#4493f8">PHP, Always in Memory</text>
<text x="480" y="78" font-size="20" font-weight="600" fill="#f0f6fc">Boot PHP once. Keep it warm.</text>
<text x="480" y="106" font-size="14" fill="#9198a1">A Rust + Tokio runtime that keeps the Zend Engine and</text>
