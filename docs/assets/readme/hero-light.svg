<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="PAM, PHP Always in Memory: one persistent PHP runtime for servers, Laravel, Android and iOS, and desktop.">
