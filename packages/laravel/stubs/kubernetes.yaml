apiVersion: apps/v1
kind: Deployment
metadata:
  name: pam-laravel
spec:
  replicas: 2
  selector:
    matchLabels: {app: pam-laravel}
  template:
    metadata:
      labels: {app: pam-laravel}
    spec:
      containers:
        - name: app
          image: ghcr.io/push-in/pam:latest
          command: ["pam"]
          args: ["pam.php"]
          env:
            - name: PORT
              value: "3010"
          ports: [{containerPort: 3010}]
          readinessProbe:
            httpGet: {path: /__pam/health, port: 3010}
          livenessProbe:
            httpGet: {path: /__pam/health, port: 3010}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
