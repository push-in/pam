name: Setup PAM
description: Install and validate a pinned PAM release
inputs:
  version:
    description: PAM release version without the v prefix
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PAM_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        architecture=$(uname -m)
        case "${architecture}" in
          x86_64) asset_arch=x86_64 ;;
          aarch64|arm64) asset_arch=aarch64 ;;
          *) printf 'Unsupported architecture: %s\n' "${architecture}" >&2; exit 1 ;;
        esac
        archive="pam-v${PAM_VERSION}-linux-${asset_arch}.tar.gz"
        release_directory="pam-v${PAM_VERSION}-linux-${asset_arch}"
        curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
          --output "${RUNNER_TEMP}/${archive}" \
          "https://github.com/push-in/pam/releases/download/v${PAM_VERSION}/${archive}"
        tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
        install -m 0755 "${RUNNER_TEMP}/${release_directory}/bin/pam" "${RUNNER_TEMP}/pam"
        printf '%s\n' "${RUNNER_TEMP}" >>"${GITHUB_PATH}"
        "${RUNNER_TEMP}/pam" --version
