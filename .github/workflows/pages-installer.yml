name: Publish installer alias

on:
  push:
    branches:
      - main
    paths:
      - install.sh
      - .github/workflows/pages-installer.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-installer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Build stable installer endpoint
        run: |
          install -d site
          install -m 0644 install.sh site/install.sh
          printf '%s\n' '<!doctype html><title>PAM installer</title><p>Use <code>curl -fsSL https://push-in.github.io/pam/install.sh | sh</code>.</p>' >site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
