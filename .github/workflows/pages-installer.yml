name: Publish installer alias

on:
  push:
    branches:
      - main
    paths:
      - install.sh
      - .github/workflows/pages-installer.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-installer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Build stable installer endpoint
        run: |
          install -d site
          install -m 0644 install.sh site/install.sh
          printf '%s\n' '<!doctype html><title>PAM installer</title><p>Use <code>curl -fsSL https://push-in.github.io/pam/install.sh | sh</code>.</p>' >site/index.html
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
