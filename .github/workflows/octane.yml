name: PAM Octane

on:
  workflow_dispatch:
  push:
    paths:
      - 'packages/octane/**'
      - 'runtime/**'
      - 'src/cluster.rs'
      - 'src/control_plane.rs'
      - 'src/ingress.rs'
      - 'src/main.rs'
      - 'src/octane.rs'
      - 'src/php.rs'
      - 'src/protocol.rs'
      - 'src/server.rs'
      - 'src/worker_state.rs'
      - 'tests/cluster.rs'
      - 'tests/server.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.github/workflows/octane.yml'
  pull_request:
    paths:
      - 'packages/octane/**'
      - 'runtime/**'
      - 'src/cluster.rs'
      - 'src/control_plane.rs'
      - 'src/ingress.rs'
      - 'src/main.rs'
      - 'src/octane.rs'
      - 'src/php.rs'
      - 'src/protocol.rs'
      - 'src/server.rs'
      - 'src/worker_state.rs'
      - 'tests/cluster.rs'
      - 'tests/server.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.github/workflows/octane.yml'

permissions:
  contents: read

concurrency:
  group: pam-octane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/octane
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            laravel: '^12.0'
            testbench: '^10.0'
            phpunit: '^12.5'
          - php: '8.4'
            laravel: '^13.0'
            testbench: '^11.0'
            phpunit: '^13.0'

    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Preflight dependency matrix
        run: composer require --dev --dry-run --with-all-dependencies --no-interaction laravel/framework:${{ matrix.laravel }} orchestra/testbench:${{ matrix.testbench }} phpunit/phpunit:${{ matrix.phpunit }}
      - run: composer require --dev --no-update laravel/framework:${{ matrix.laravel }} orchestra/testbench:${{ matrix.testbench }} phpunit/phpunit:${{ matrix.phpunit }}
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer verify
      - run: composer audit --no-interaction

  native-bridge:
    name: Native PAM ↔ Octane smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Install PHP Embed development package
        run: |
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install -y libphp8.4-embed php8.4-dev php8.4-sqlite3
      - uses: Swatinem/rust-cache@v2
      - name: Preflight package dependencies
        working-directory: packages/octane
        run: composer install --dry-run --no-interaction --prefer-dist
      - name: Install package dependencies
        working-directory: packages/octane
        run: composer install --no-interaction --prefer-dist
      - name: Preflight native fixture dependencies
        working-directory: compat/composer-smoke
        run: composer install --dry-run --no-interaction --prefer-dist
      - name: Install native fixture dependencies
        working-directory: compat/composer-smoke
        run: composer install --no-interaction --prefer-dist
      - name: Build PAM and run native runtime contracts
        run: |
          cargo build --locked
          cargo test --locked --test cluster --test server -- --test-threads=1
      - name: Serve Laravel through PAM Octane
        working-directory: packages/octane/tests/Fixtures/laravel
        run: |
          ../../../../../target/debug/pam artisan pam:octane --host=127.0.0.1 --port=38080 >octane.log 2>&1 &
          server_pid=$!
          trap 'kill -TERM "${server_pid}" 2>/dev/null || true; wait "${server_pid}" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            curl --fail --silent --max-time 1 http://127.0.0.1:38080/api/ping | grep -q '"pong"' && exit 0
            kill -0 "${server_pid}" 2>/dev/null || { cat octane.log; exit 1; }
            sleep 0.1
          done
          cat octane.log
          exit 1
