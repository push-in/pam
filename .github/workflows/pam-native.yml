name: Pam Native

on:
  push:
    branches:
      - main
    paths:
      - 'pam-native/**'
      - 'src/mobile.rs'
      - 'src/commands.rs'
      - '.github/workflows/pam-native.yml'
  pull_request:
    paths:
      - 'pam-native/**'
      - 'src/mobile.rs'
      - 'src/commands.rs'
      - '.github/workflows/pam-native.yml'
  workflow_dispatch:
    inputs:
      physical_benchmark:
        description: Run Macrobenchmark on a connected physical Android runner
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  sdk:
    name: Protocol, PHP SDK, and Android release host
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android
          components: clippy,rustfmt
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android toolchain
        run: |
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.1.12297006' \
            'cmake;3.22.1'
      - name: Install PHP Embed development package
        run: |
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install -y libphp8.4-embed php8.4-dev
      - uses: Swatinem/rust-cache@v2
      - name: Validate locked manifests
        run: |
          composer validate --strict --no-check-lock pam-native/packages/native/composer.json
          composer validate --strict --no-check-lock pam-native/examples/community-plugin/composer.json
          composer validate --strict --working-dir=pam-native/examples/showcase
          cargo metadata --locked --manifest-path pam-native/Cargo.toml --no-deps
      - name: Install showcase from the locked local package
        run: |
          composer install --working-dir=pam-native/examples/showcase --no-interaction
          composer install --working-dir=compat/composer-smoke --no-interaction --prefer-dist
      - name: SDK contracts
        run: |
          cargo fmt --all -- --check
          cargo test --locked --manifest-path pam-native/Cargo.toml
          php pam-native/packages/native/tests/run.php
          python3 -m unittest pam-native/benchmarks/mobile/test_compare.py
          scripts/package-release.sh validate
      - name: PHP static analysis
        run: compat/composer-smoke/vendor/bin/phpstan analyse -c pam-native/packages/native/phpstan.neon --no-progress
      - name: Build release-like Android app and benchmark APK
        run: |
          cargo run --locked -- mobile build pam-native/examples/showcase --abi arm64-v8a --release
          pam_workspace=pam-native/examples/showcase/.pam-native/android
          "$pam_workspace/gradlew" \
            :app:assembleBenchmark \
            :macrobenchmark:assembleBenchmark \
            :app:lintRelease \
            :app:lintBenchmark \
            --stacktrace \
            --no-daemon \
            -p "$pam_workspace"
      - name: Enforce Android release gates
        run: |
          release_apk=pam-native/examples/showcase/.pam-native/android/app/build/outputs/apk/release/app-release-unsigned.apk
          benchmark_apk=pam-native/examples/showcase/.pam-native/android/app/build/outputs/apk/benchmark/app-benchmark.apk
          test -f "$release_apk"
          test -f "$benchmark_apk"
          zipalign -c -P 16 -v 4 "$release_apk"
          zipalign -c -P 16 -v 4 "$benchmark_apk"
          release_apk_bytes=$(stat -c '%s' "$release_apk")
          benchmark_apk_bytes=$(stat -c '%s' "$benchmark_apk")
          printf 'release_apk_bytes=%s\nbenchmark_apk_bytes=%s\n' \
            "$release_apk_bytes" \
            "$benchmark_apk_bytes" |
            tee pam-native-apk-size.txt
          test "$release_apk_bytes" -le 50000000
          test "$benchmark_apk_bytes" -le 50000000
      - uses: actions/upload-artifact@v4
        with:
          name: pam-native-release-arm64
          path: |
            pam-native/examples/showcase/.pam-native/android/app/build/outputs/apk/release/*.apk
            pam-native/examples/showcase/.pam-native/android/app/build/outputs/apk/benchmark/*.apk
            pam-native/examples/showcase/.pam-native/android/macrobenchmark/build/outputs/apk/benchmark/*.apk
            pam-native-apk-size.txt
          if-no-files-found: error

  physical-benchmark:
    name: Physical Android Macrobenchmark
    if: github.event_name == 'workflow_dispatch' && inputs.physical_benchmark
    runs-on:
      - self-hosted
      - linux
      - android
      - physical
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - name: Verify benchmark device
        run: |
          adb wait-for-device
          test "$(adb shell getprop ro.kernel.qemu | tr -d '\r')" != "1"
          adb shell dumpsys battery | grep -q 'powered: false'
      - name: Generate profile and run locked physical-device benchmark
        run: |
          composer install --working-dir=pam-native/examples/showcase --no-interaction
          cargo run --locked -- mobile profile pam-native/examples/showcase
          cargo run --locked -- mobile benchmark pam-native/examples/showcase
      - uses: actions/upload-artifact@v4
        with:
          name: pam-native-macrobenchmark-${{ github.run_id }}
          path: |
            pam-native/examples/showcase/.pam-native/android/app/src/main/baseline-prof.txt
            pam-native/examples/showcase/.pam-native/android/macrobenchmark/build/outputs/connected_android_test_additional_output/**
            pam-native/examples/showcase/.pam-native/android/macrobenchmark/build/reports/**
          if-no-files-found: error
