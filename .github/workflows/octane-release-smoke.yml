name: PAM Octane public release smoke

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published PAM release tag, for example v1.0.3
        required: true
        type: string
      package_version:
        description: Published pushinbr/pam-octane version, for example 1.0.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pam-octane-public-smoke-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  install-and-serve:
    name: Install public artifacts and serve a fresh Laravel app
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate requested versions
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "${PACKAGE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
      - name: Download and verify the public installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p "${RUNNER_TEMP}/pam-release"
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern install.sh --pattern install.sh.sha256 \
            --dir "${RUNNER_TEMP}/pam-release"
          cd "${RUNNER_TEMP}/pam-release"
          sha256sum --check install.sh.sha256
      - name: Install the published PAM runtime
        env:
          PAM_VERSION: ${{ inputs.release_tag }}
          PAM_INSTALL_DIR: ${{ runner.temp }}/pam
          PAM_BIN_DIR: ${{ runner.temp }}/bin
        run: sh "${RUNNER_TEMP}/pam-release/install.sh"
      - name: Create a fresh Laravel application
        run: |
          export PATH="${RUNNER_TEMP}/bin:${PATH}"
          pam init "${RUNNER_TEMP}/octane-app" --template laravel --no-interaction
      - name: Preflight the public Octane package
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        working-directory: ${{ runner.temp }}/octane-app
        run: |
          export PATH="${RUNNER_TEMP}/bin:${PATH}"
          pam composer show pushinbr/pam-octane --all
          pam composer require --dry-run --no-interaction \
            laravel/octane:^2.19 "pushinbr/pam-octane:${PACKAGE_VERSION}"
      - name: Install the public Octane package
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        working-directory: ${{ runner.temp }}/octane-app
        run: |
          export PATH="${RUNNER_TEMP}/bin:${PATH}"
          pam composer require --no-interaction \
            laravel/octane:^2.19 "pushinbr/pam-octane:${PACKAGE_VERSION}"
      - name: Exercise start and HTTP request
        working-directory: ${{ runner.temp }}/octane-app
        run: |
          export PATH="${RUNNER_TEMP}/bin:${PATH}"
          pam octane:start --host=127.0.0.1 --port=38080 >octane.log 2>&1 &
          server_pid=$!
          trap 'kill -TERM "${server_pid}" 2>/dev/null || true; wait "${server_pid}" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 150); do
            if curl --fail --silent --max-time 1 \
              http://127.0.0.1:38080/api/ping | grep -q '"pong"'; then
              pam doctor .
              pam octane:status
              pam octane:reload
              sleep 1
              curl --fail --silent --max-time 2 \
                http://127.0.0.1:38080/api/ping | grep -q '"pong"'
              pam octane:stop
              wait "${server_pid}"
              trap - EXIT
              exit 0
            fi
            kill -0 "${server_pid}" 2>/dev/null || { cat octane.log; exit 1; }
            sleep 0.1
          done
          cat octane.log
          exit 1
