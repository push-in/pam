name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Check out the pinned PAM Native SDK
        uses: actions/checkout@v5
        with:
          repository: push-in/pam-native
          ref: 26a768c9a7e0137bda9fa7de23f46c9308de2839
          path: pam-native
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - name: Install PHP Embed development package
        run: |
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install -y \
            libphp8.4-embed php8.4-dev php8.4-bcmath php8.4-curl php8.4-gd \
            php8.4-intl php8.4-mbstring php8.4-mysql php8.4-pgsql \
            php8.4-sqlite3 php8.4-xml php8.4-zip
      - uses: Swatinem/rust-cache@v2
      - name: Validate locked Composer dependencies
        run: |
          composer validate --strict --working-dir=compat/composer-smoke
          composer validate --strict --working-dir=compat/laravel-smoke
      - name: Validate Pam package manifests
        run: |
          for package in packages/*/composer.json; do
            composer validate --strict --no-check-lock --no-check-publish "$package"
          done
          scripts/package-release.sh validate
      - name: Install locked Composer dependencies
        run: |
          composer install --working-dir=compat/composer-smoke --no-interaction --prefer-dist
          composer install --working-dir=compat/laravel-smoke --no-interaction --prefer-dist
      - name: Format
        run: |
          cargo fmt --all -- --check
          cargo run --locked -- docs:generate docs/cli-reference.md --check
          python3 -m json.tool docs/schemas/pam.schema.json >/dev/null
          python3 scripts/check-docs.py
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Rust and integration tests
        run: |
          cargo test --locked --all-targets --all-features -- --test-threads=1
          cargo test --locked --manifest-path pam-native/Cargo.toml
          php pam-native/packages/native/tests/run.php
      - name: PHP static analysis
        run: |
          compat/composer-smoke/vendor/bin/phpstan analyse -c compat/composer-smoke/phpstan.neon --no-progress
          compat/laravel-smoke/vendor/bin/phpstan analyse -c compat/laravel-smoke/phpstan.neon --no-progress
      - name: Composer compatibility tests
        run: compat/composer-smoke/vendor/bin/phpunit -c compat/composer-smoke/phpunit.xml
      - name: Embed SAPI compatibility tests
        run: |
          ./target/debug/pam test compat/composer-smoke --phpunit -c phpunit.xml
          ./target/debug/pam test compat/composer-smoke --pest
      - name: Build release binary
        run: cargo build --locked --release
      - name: Smoke test isolated runtime bundle
        run: |
          runtime_dist=$(mktemp -d)
          trap 'rm -rf -- "$runtime_dist"' EXIT
          ./scripts/package-runtime.sh \
            target/release/pam ci linux-x86_64 "$runtime_dist"
          test -f "$runtime_dist/pam-ci-linux-x86_64/share/pam/native/android/settings.gradle.kts"
          test -f "$runtime_dist/pam-ci-linux-x86_64/share/pam/native/packages/native/composer.json"
          test -f "$runtime_dist/pam-ci-linux-x86_64/share/pam/runtime/catalog.json"
          "$runtime_dist/pam-ci-linux-x86_64/bin/pam-run" -r '
          foreach (["curl", "intl", "mbstring", "pdo_mysql", "pdo_pgsql", "pdo_sqlite", "sockets", "xml", "zip"] as $extension) {
              if (!extension_loaded($extension)) {
                  fwrite(STDERR, "Missing bundled extension: {$extension}\n");
                  exit(1);
              }
          }
          '
