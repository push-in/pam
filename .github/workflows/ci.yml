name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: push-in/pam-native
          ref: v0.5.34
          path: pam-native
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: push-in/pam-mobile-ui-php
          ref: v0.2.1
          path: pam-mobile-ui
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy,rustfmt
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - name: Install PHP Embed development package
        run: |
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install -y \
            libphp8.4-embed php8.4-dev php8.4-bcmath php8.4-curl php8.4-gd \
            php8.4-intl php8.4-mbstring php8.4-mysql php8.4-pgsql \
            php8.4-sqlite3 php8.4-xml php8.4-zip
      - uses: Swatinem/rust-cache@v2
      - name: Validate locked Composer dependencies
        run: |
          composer validate --strict --working-dir=compat/composer-smoke
          composer validate --strict --working-dir=compat/laravel-smoke
      - name: Validate Pam package manifests
        run: |
          for package in packages/*/composer.json; do
            composer validate --strict --no-check-lock --no-check-publish "$package"
          done
      - name: Install locked Composer dependencies
        run: |
          composer install --working-dir=compat/composer-smoke --no-interaction --prefer-dist
          composer install --working-dir=compat/laravel-smoke --no-interaction --prefer-dist
      - name: Format
        run: |
          cargo fmt --all -- --check
          python3 -m json.tool runtime/catalog.json >/dev/null
          bash -n runtime-builder/android/build.sh
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Rust and integration tests
        run: cargo test --locked --all-targets --all-features -- --test-threads=1
      - name: Validate generated RPC SDK syntax
        run: scripts/check-generated-rpc.sh
      - name: PHP static analysis
        run: |
          compat/composer-smoke/vendor/bin/phpstan analyse -c compat/composer-smoke/phpstan.neon --no-progress
          compat/laravel-smoke/vendor/bin/phpstan analyse -c compat/laravel-smoke/phpstan.neon --no-progress
      - name: Composer compatibility tests
        run: compat/composer-smoke/vendor/bin/phpunit -c compat/composer-smoke/phpunit.xml
      - name: Embed SAPI compatibility tests
        run: |
          ./target/debug/pam test compat/composer-smoke --phpunit -c phpunit.xml
          ./target/debug/pam test compat/composer-smoke --pest
      - name: Supply-chain policy gate
        run: |
          ./target/debug/pam supply-chain compat/composer-smoke \
            --output "${RUNNER_TEMP}/composer-supply-chain.json"
          ./target/debug/pam supply-chain compat/laravel-smoke \
            --output "${RUNNER_TEMP}/laravel-supply-chain.json"
      - name: Build release binary
        run: cargo build --locked --release
      - name: Create Android runtime packaging fixture
        run: |
          for runtime_id in 8.4.23-r1 8.5.8-r1; do
            for android_abi in arm64-v8a x86_64; do
              runtime="runtime/android/${runtime_id}/${android_abi}"
              mkdir -p \
                "${runtime}/lib" \
                "${runtime}/include/php/main" \
                "${runtime}/include/php/sapi/embed"
              printf 'fixture\n' > "${runtime}/lib/libphp.a"
              printf '/* fixture */\n' > "${runtime}/include/php/main/php.h"
              printf '/* fixture */\n' > \
                "${runtime}/include/php/sapi/embed/php_embed.h"
              printf '{"runtimeId":"%s","androidAbi":"%s"}\n' \
                "${runtime_id}" "${android_abi}" > "${runtime}/runtime.json"
            done
          done
          for rust_target in aarch64-linux-android x86_64-linux-android; do
            engine="pam-native/target/${rust_target}/release"
            mkdir -p "${engine}"
            printf 'fixture\n' > "${engine}/libpam_native_engine.a"
          done
      - name: Smoke test isolated runtime bundle
        run: |
          runtime_dist=$(mktemp -d)
          trap 'rm -rf -- "$runtime_dist"' EXIT
          ./scripts/package-runtime.sh \
            target/release/pam ci linux-x86_64 "$runtime_dist"
          "$runtime_dist/pam-ci-linux-x86_64/bin/pam-run" -r '
          foreach (["curl", "intl", "mbstring", "pdo_mysql", "pdo_pgsql", "pdo_sqlite", "sockets", "xml", "zip"] as $extension) {
              if (!extension_loaded($extension)) {
                  fwrite(STDERR, "Missing bundled extension: {$extension}\n");
                  exit(1);
              }
          }
          '
      - uses: actions/upload-artifact@v7
        with:
          name: pam-linux-x86_64
          path: target/release/pam
          if-no-files-found: error
