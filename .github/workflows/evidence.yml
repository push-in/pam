name: Performance evidence

on:
  schedule:
    - cron: '23 3 * * 2'
  workflow_dispatch:
    inputs:
      suite_id:
        description: 1 comparison, 2 worker matrix, 3 runtime soak, 4 overload, 5 manager recovery, 6 PM2 recovery comparison, 7 manager recovery worker matrix, 8 extension isolation
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
          - '7'
          - '8'

permissions:
  contents: read

concurrency:
  group: pam-evidence-${{ github.ref }}-${{ github.event_name == 'schedule' && '1' || inputs.suite_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  benchmark:
    name: Evidence suite ${{ github.event_name == 'schedule' && '1' || inputs.suite_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PAM_EVIDENCE_SUITE_ID: ${{ github.event_name == 'schedule' && '1' || inputs.suite_id }}
      PAM_BENCH_ROUNDS: '5'
      PAM_BENCH_DURATION: 15s
      PAM_BENCH_WARMUP_DURATION: 5s
      PAM_BENCH_COOLDOWN: '1'
      PAM_BENCH_WORKER_MATRIX: 1 4 8
      PAM_SOAK_DURATION: 30m
      PAM_RECOVERY_ROUNDS: '10'
      PAM_RECOVERY_MATRIX_ROUNDS: '10'
      PAM_RECOVERY_MAX_P95_MILLIS: '200'
      PAM_RECOVERY_MAX_DETECTION_P95_MILLIS: '10'
      PAM_RECOVERY_MAX_BACKOFF_P95_MILLIS: '20'
      PAM_RECOVERY_MAX_READINESS_P95_MILLIS: '150'
      PAM_RECOVERY_MAX_RSS_GROWTH_BYTES: '16777216'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check out the pinned PAM Native SDK
        uses: actions/checkout@v5
        with:
          repository: push-in/pam-native
          ref: 4997e3912329b3c2e4b4e6df1eecfc04eeee8189
          path: pam-native
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        if: env.PAM_EVIDENCE_SUITE_ID == '6'
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: benchmarks/process-manager/pm2/package-lock.json
      - name: Install benchmark system dependencies
        run: |
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install -y libphp8.5-embed php8.5-dev php8.5-sqlite3 wrk
      - uses: Swatinem/rust-cache@v2
        with:
          key: evidence-${{ env.PAM_EVIDENCE_SUITE_ID }}
      - name: Preflight locked benchmark dependencies
        run: composer install --working-dir=packages/octane --dry-run --no-interaction --prefer-dist
      - name: Install locked benchmark dependencies
        run: composer install --working-dir=packages/octane --no-interaction --prefer-dist
      - name: Preflight locked manager fixture dependencies
        if: env.PAM_EVIDENCE_SUITE_ID == '5' || env.PAM_EVIDENCE_SUITE_ID == '6' || env.PAM_EVIDENCE_SUITE_ID == '7' || env.PAM_EVIDENCE_SUITE_ID == '8'
        run: composer install --working-dir=compat/composer-smoke --dry-run --no-dev --no-interaction --prefer-dist
      - name: Install locked manager fixture dependencies
        if: env.PAM_EVIDENCE_SUITE_ID == '5' || env.PAM_EVIDENCE_SUITE_ID == '6' || env.PAM_EVIDENCE_SUITE_ID == '7' || env.PAM_EVIDENCE_SUITE_ID == '8'
        run: composer install --working-dir=compat/composer-smoke --no-dev --no-interaction --prefer-dist
      - name: Preflight locked PM2 comparison dependencies
        if: env.PAM_EVIDENCE_SUITE_ID == '6'
        working-directory: benchmarks/process-manager/pm2
        run: |
          npm view pm2@7.0.3 version engines deprecated dist.integrity --json
          npm ci --dry-run --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
      - name: Install locked PM2 comparison dependencies
        if: env.PAM_EVIDENCE_SUITE_ID == '6'
        working-directory: benchmarks/process-manager/pm2
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the measured release binary
        run: cargo build --locked --release
      - name: Run selected evidence suite
        run: |
          case "${PAM_EVIDENCE_SUITE_ID}" in
            1) benchmarks/octane/run.sh ;;
            2) benchmarks/octane/matrix.sh ;;
            3) benchmarks/octane/soak.sh ;;
            4) benchmarks/octane/overload.sh ;;
            5) benchmarks/process-manager/run.sh ;;
            6) benchmarks/process-manager/compare-pm2.sh ;;
            7) benchmarks/process-manager/worker-matrix.sh ;;
            8) benchmarks/process-manager/extension-profile.sh ;;
            *) printf 'unknown evidence suite id: %s\n' "${PAM_EVIDENCE_SUITE_ID}" >&2; exit 64 ;;
          esac
      - name: Verify evidence before publication
        run: |
          case "${PAM_EVIDENCE_SUITE_ID}" in
            1) results=benchmarks/octane/results ;;
            2) results=benchmarks/octane/results/matrix ;;
            3) results=benchmarks/octane/results/soak ;;
            4) results=benchmarks/octane/results/overload ;;
            5) results=benchmarks/process-manager/results ;;
            6) results=benchmarks/process-manager/results/comparison ;;
            7) results=benchmarks/process-manager/results/worker-matrix ;;
            8) results=benchmarks/process-manager/results/extension-profile ;;
          esac
          php benchmarks/octane/evidence-manifest.php \
            "${results}" "${PAM_EVIDENCE_SUITE_ID}" --verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pam-evidence-suite-${{ env.PAM_EVIDENCE_SUITE_ID }}-${{ github.sha }}
          path: |
            benchmarks/octane/results/
            benchmarks/process-manager/results/
          if-no-files-found: error
          retention-days: 30
