name: Laravel reference application

on:
  pull_request:
    paths:
      - 'examples/laravel-saas-api/**'
      - '.github/workflows/laravel-reference-app.yml'
  push:
    branches:
      - main
    paths:
      - 'examples/laravel-saas-api/**'
      - '.github/workflows/laravel-reference-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          tools: composer:v2
      - name: Resolve the reference application
        working-directory: examples/laravel-saas-api
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: Validate and test
        working-directory: examples/laravel-saas-api
        run: |
          composer validate --strict
          composer audit
          vendor/bin/phpunit
