name: Laravel runtime benchmarks

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      duration:
        description: Seconds per measured round
        required: false
        default: '15'
      rounds:
        description: Measured rounds per runtime
        required: false
        default: '3'

permissions:
  contents: read

concurrency:
  group: laravel-benchmarks
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - name: Install benchmark toolchain
        run: |
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install -y libphp8.4-embed php8.4-dev wrk jq
      - uses: Swatinem/rust-cache@v2
        with:
          key: laravel-benchmarks
      - name: Install locked Laravel benchmark dependencies
        run: composer install --working-dir=compat/laravel-smoke --no-interaction --no-progress --prefer-dist
      - name: Build release runtime
        run: cargo build --locked --release
      - name: Run isolated runtime matrix
        env:
          PAM_BENCH_DURATION_SECONDS: ${{ inputs.duration || '15' }}
          PAM_BENCH_ROUNDS: ${{ inputs.rounds || '3' }}
          PAM_BENCH_WARMUP_SECONDS: '5'
          PAM_BENCH_THREADS: '2'
          PAM_BENCH_CONNECTIONS: '32'
          PAM_BENCH_WORKERS: '4'
        run: scripts/benchmark-laravel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: laravel-runtime-benchmarks
          path: benchmarks/results/
          if-no-files-found: error
          retention-days: 90
