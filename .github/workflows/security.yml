name: Security and soak

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
      - name: Install PHP Embed development package
        run: |
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install -y libphp8.5-embed php8.5-dev valgrind
      - uses: Swatinem/rust-cache@v2
      - name: Audit Rust lockfile
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: Audit Composer lockfile
        run: |
          composer audit --working-dir=compat/composer-smoke --locked
          composer audit --working-dir=compat/laravel-smoke --locked
          composer install --working-dir=packages/http --no-interaction --prefer-dist --dry-run
          composer install --working-dir=packages/http --no-interaction --prefer-dist
          composer audit --working-dir=packages/http --locked
          composer install --working-dir=packages/octane --no-interaction --prefer-dist --dry-run
          composer install --working-dir=packages/octane --no-interaction --prefer-dist
          composer audit --working-dir=packages/octane
      - name: Coverage-guided dispatch protocol fuzzing
        run: |
          cargo install cargo-fuzz --version 0.13.2 --locked
          cargo fuzz run dispatch_envelope -- \
            -max_total_time=120 -timeout=5 -rss_limit_mb=2048
      - name: Install locked Composer test dependencies
        run: |
          composer install --working-dir=compat/composer-smoke --no-interaction --prefer-dist --dry-run
          composer install --working-dir=compat/laravel-smoke --no-interaction --prefer-dist --dry-run
          composer install --working-dir=compat/composer-smoke --no-interaction --prefer-dist
          composer install --working-dir=compat/laravel-smoke --no-interaction --prefer-dist
      - name: Memory soak contracts
        run: |
          cargo test --locked protocol_tests -- --nocapture
          cargo test --locked --test memory -- --nocapture --test-threads=1
          cargo test --locked --test laravel -- --nocapture --test-threads=1
      - name: Native shutdown smoke under Valgrind
        run: |
          cargo build --locked
          clean_ini_dir="${RUNNER_TEMP}/pam-valgrind-ini"
          mkdir -p "${clean_ini_dir}"
          PHPRC=/dev/null PHP_INI_SCAN_DIR="${clean_ini_dir}" \
            valgrind --error-exitcode=1 \
              --errors-for-leak-kinds=definite,indirect \
              --leak-check=full \
              --suppressions=.github/valgrind/php-embed.supp \
              ./target/debug/pam tests/fixtures/hello.php
