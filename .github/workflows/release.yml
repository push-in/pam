name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - name: Install PHP Embed toolchain
        run: |
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install -y \
            libphp8.4-embed php8.4-dev php8.4-bcmath php8.4-curl php8.4-gd \
            php8.4-intl php8.4-mbstring php8.4-mysql php8.4-pgsql \
            php8.4-sqlite3 php8.4-xml php8.4-zip
      - uses: Swatinem/rust-cache@v2
      - name: Validate locked Composer dependencies
        run: |
          composer validate --strict --working-dir=compat/composer-smoke
          composer validate --strict --working-dir=compat/laravel-smoke
      - name: Install locked Composer test dependencies
        run: |
          composer install --working-dir=compat/composer-smoke --no-interaction --prefer-dist
          composer install --working-dir=compat/laravel-smoke --no-interaction --prefer-dist
      - name: Test, analyze, and build
        run: |
          cargo fmt --all -- --check
          cargo test --locked --all-targets --all-features -- --test-threads=1
          compat/composer-smoke/vendor/bin/phpstan analyse -c compat/composer-smoke/phpstan.neon --no-progress
          compat/laravel-smoke/vendor/bin/phpstan analyse -c compat/laravel-smoke/phpstan.neon --no-progress
          ./target/debug/pam test compat/composer-smoke --phpunit --colors=never
          ./target/debug/pam test compat/composer-smoke --pest --colors=never
          cargo build --locked --release
      - name: Package self-contained runtime
        env:
          PAM_TARGET: ${{ matrix.target }}
          PAM_VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          ./scripts/package-runtime.sh \
            target/release/pam "${PAM_VERSION}" "${PAM_TARGET}" dist
      - name: Attest release archive
        uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: pam-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: pam-*
          path: dist
          merge-multiple: true
      - name: Package the user-mode installer
        run: |
          cp install.sh dist/install.sh
          (
            cd dist
            sha256sum install.sh > install.sh.sha256
          )
      - name: Attest the installer
        uses: actions/attest@v4
        with:
          subject-path: dist/install.sh
      - name: Publish immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag
