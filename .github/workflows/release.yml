name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - name: Install PHP Embed toolchain
        run: |
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install -y libphp8.4-embed php8.4-dev
      - uses: Swatinem/rust-cache@v2
      - name: Validate locked Composer dependencies
        run: |
          composer validate --strict --working-dir=compat/composer-smoke
          composer validate --strict --working-dir=compat/laravel-smoke
      - name: Install locked Composer test dependencies
        run: |
          composer install --working-dir=compat/composer-smoke --no-interaction --prefer-dist
          composer install --working-dir=compat/laravel-smoke --no-interaction --prefer-dist
      - name: Test, analyze, and build
        run: |
          cargo fmt --all -- --check
          cargo test --locked --all-targets --all-features -- --test-threads=1
          compat/composer-smoke/vendor/bin/phpstan analyse -c compat/composer-smoke/phpstan.neon --no-progress
          compat/laravel-smoke/vendor/bin/phpstan analyse -c compat/laravel-smoke/phpstan.neon --no-progress
          ./target/debug/pam test compat/composer-smoke --phpunit --colors=never
          ./target/debug/pam test compat/composer-smoke --pest --colors=never
          cargo build --locked --release
      - name: Package runtime and PHP ABI library
        env:
          PAM_TARGET: ${{ matrix.target }}
          PAM_VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          package="pam-${PAM_VERSION}-${PAM_TARGET}"
          mkdir -p "dist/${package}/bin" "dist/${package}/lib"
          cp target/release/pam "dist/${package}/bin/pam"
          php_library=$(ldd target/release/pam | awk '/libphp/{print $3; exit}')
          test -f "$php_library"
          cp "$php_library" "dist/${package}/lib/"
          cat > "dist/${package}/bin/pam-run" <<'EOF'
          #!/bin/sh
          set -eu
          PAM_HOME=$(CDPATH= cd -- "$(dirname -- "$0")/.." && pwd)
          export LD_LIBRARY_PATH="$PAM_HOME/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$PAM_HOME/bin/pam" "$@"
          EOF
          chmod 0755 "dist/${package}/bin/pam-run"
          cp LICENSE README.md "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "$package"
          sha256sum "dist/${package}.tar.gz" > "dist/${package}.tar.gz.sha256"
      - name: Attest release archive
        uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: pam-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pam-*
          path: dist
          merge-multiple: true
      - name: Publish immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag
