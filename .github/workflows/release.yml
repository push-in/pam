name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to publish
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release-preflight:
    name: Validate release authority before expensive builds
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable tag and protected signing configuration
        env:
          PAM_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          PAM_EVIDENCE_KEY: ${{ secrets.PAM_DISTRIBUTION_EVIDENCE_KEY }}
          PAM_EVIDENCE_KEY_IDENTITY: ${{ vars.PAM_DISTRIBUTION_EVIDENCE_KEY_SHA256 }}
          PAM_NEXT_EVIDENCE_KEY_IDENTITY: ${{ vars.PAM_DISTRIBUTION_NEXT_EVIDENCE_KEY_SHA256 }}
        run: |
          scripts/package-release.sh validate-tag "${PAM_RELEASE_TAG}"
          checked_out_revision=$(git rev-parse HEAD)
          tagged_revision=$(git rev-parse "refs/tags/${PAM_RELEASE_TAG}^{commit}")
          test "${checked_out_revision}" = "${tagged_revision}"
          test -n "${PAM_EVIDENCE_KEY}"
          printf '%s' "${PAM_EVIDENCE_KEY_IDENTITY}" | grep -Eq '^[0-9a-f]{64}$'
          if test -n "${PAM_NEXT_EVIDENCE_KEY_IDENTITY}"; then
            printf '%s' "${PAM_NEXT_EVIDENCE_KEY_IDENTITY}" | grep -Eq '^[0-9a-f]{64}$'
            test "${PAM_NEXT_EVIDENCE_KEY_IDENTITY}" != "${PAM_EVIDENCE_KEY_IDENTITY}"
          fi

  ecosystem-compatibility:
    name: Certify the complete PAM Native ecosystem
    needs: release-preflight
    uses: ./.github/workflows/ecosystem-compatibility.yml
    with:
      pam_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

  android-runtime:
    name: Build verified Android runtimes and engines
    needs: release-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - name: Validate tag matches the runtime version
        env:
          PAM_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: scripts/package-release.sh validate-tag "${PAM_RELEASE_TAG}"
      - uses: actions/checkout@v5
        with:
          repository: push-in/pam-native
          ref: 5f42c2a5ba2c16bf4d487ee98de7b7eb4d90390a
          path: pam-native
          persist-credentials: false
      - uses: android-actions/setup-android@v4
      - name: Install pinned Android NDK
        run: sdkmanager "ndk;27.1.12297006"
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: pam-android-runtime
      - name: Build both PHP release lines and PAM Native engines
        run: |
          runtime-builder/android/build.sh --php 8.4 all
          runtime-builder/android/build.sh --php 8.5 all
          toolchain="${ANDROID_HOME}/ndk/27.1.12297006/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${toolchain}/aarch64-linux-android26-clang" \
            cargo build --locked --release \
              --manifest-path pam-native/Cargo.toml \
              -p pam-native-engine --target aarch64-linux-android
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="${toolchain}/x86_64-linux-android26-clang" \
            cargo build --locked --release \
              --manifest-path pam-native/Cargo.toml \
              -p pam-native-engine --target x86_64-linux-android
      - name: Package and attest the verified runtime bundle
        run: scripts/package-android-runtime.sh pam-native dist
      - uses: actions/attest@v4
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: dist/pam-android-runtime.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: pam-android-runtime
          path: |
            dist/pam-android-runtime.tar.gz
            dist/pam-android-runtime.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  build:
    needs: release-preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Prepare the portable build environment
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates curl git gnupg software-properties-common sudo \
            unzip zstd
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - name: Validate tag matches the runtime version
        env:
          PAM_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: scripts/package-release.sh validate-tag "${PAM_RELEASE_TAG}"
      - name: Check out the pinned PAM Native SDK
        uses: actions/checkout@v5
        with:
          repository: push-in/pam-native
          ref: 5f42c2a5ba2c16bf4d487ee98de7b7eb4d90390a
          path: pam-native
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
      - name: Install PHP Embed toolchain
        run: |
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            -o Dpkg::Options::=--force-confnew \
            libphp8.5-embed php8.5-dev php8.5-bcmath php8.5-curl php8.5-gd \
            php8.5-intl php8.5-mbstring php8.5-mysql php8.5-pgsql \
            php8.5-sqlite3 php8.5-xml php8.5-zip
      - name: Build the pinned portable timezone database
        run: |
          archive=${RUNNER_TEMP}/timezonedb-2026.3.tgz
          source=${RUNNER_TEMP}/timezonedb-2026.3
          curl --fail --silent --show-error --location \
            https://pecl.php.net/get/timezonedb-2026.3.tgz \
            --output "${archive}"
          printf '%s  %s\n' \
            4b6cbc1f3fe7aebf9e2d9f00469afb4a050c8b196f18b1e637fda4b33df17dd1 \
            "${archive}" | sha256sum --check --strict
          mkdir -p "${source}"
          tar -xzf "${archive}" -C "${source}" --strip-components=1
          cd "${source}"
          phpize8.5
          ./configure --with-php-config=php-config8.5
          make -j2
          sudo make install
      - uses: Swatinem/rust-cache@v2
      - name: Validate locked Composer dependencies
        run: |
          composer validate --strict --working-dir=compat/composer-smoke
          composer validate --strict --working-dir=compat/laravel-smoke
          composer validate --strict --no-check-lock --working-dir=packages/octane
      - name: Install locked Composer test dependencies
        run: |
          composer install --working-dir=compat/composer-smoke --no-interaction --prefer-dist --dry-run
          composer install --working-dir=compat/laravel-smoke --no-interaction --prefer-dist --dry-run
          composer install --working-dir=packages/octane --no-interaction --prefer-dist --dry-run
          composer install --working-dir=compat/composer-smoke --no-interaction --prefer-dist
          composer install --working-dir=compat/laravel-smoke --no-interaction --prefer-dist
          composer install --working-dir=packages/octane --no-interaction --prefer-dist
      - name: Test, analyze, and build
        env:
          PAM_UPDATE_SIGNING_IDENTITY_SHA256: ${{ vars.PAM_DISTRIBUTION_EVIDENCE_KEY_SHA256 }}
          PAM_UPDATE_NEXT_SIGNING_IDENTITY_SHA256: ${{ vars.PAM_DISTRIBUTION_NEXT_EVIDENCE_KEY_SHA256 }}
        run: |
          printf '%s' "${PAM_UPDATE_SIGNING_IDENTITY_SHA256}" | grep -Eq '^[0-9a-f]{64}$'
          if test -n "${PAM_UPDATE_NEXT_SIGNING_IDENTITY_SHA256}"; then
            printf '%s' "${PAM_UPDATE_NEXT_SIGNING_IDENTITY_SHA256}" | grep -Eq '^[0-9a-f]{64}$'
            test "${PAM_UPDATE_NEXT_SIGNING_IDENTITY_SHA256}" != "${PAM_UPDATE_SIGNING_IDENTITY_SHA256}"
          fi
          cargo fmt --all -- --check
          cargo run --locked -- docs:generate docs/cli-reference.md --check
          python3 -m json.tool docs/schemas/pam.schema.json >/dev/null
          python3 -m json.tool docs/schemas/distribution-evidence.schema.json >/dev/null
          python3 -m json.tool docs/schemas/desktop-platform-verification.schema.json >/dev/null
          python3 scripts/check-docs.py
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features -- --test-threads=1
          compat/composer-smoke/vendor/bin/phpstan analyse -c compat/composer-smoke/phpstan.neon --no-progress
          compat/laravel-smoke/vendor/bin/phpstan analyse -c compat/laravel-smoke/phpstan.neon --no-progress
          composer --working-dir=packages/octane verify
          scripts/package-release.sh validate
          ./target/debug/pam test compat/composer-smoke --phpunit --colors=never
          ./target/debug/pam test compat/composer-smoke --pest --colors=never
          cargo build --locked --release
      - name: Verify release binary identity
        env:
          PAM_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: test "$(target/release/pam --version)" = "pam ${PAM_RELEASE_TAG#v}"
      - name: Package self-contained runtime
        env:
          PAM_TARGET: ${{ matrix.target }}
          PAM_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          mkdir -p dist
          ./scripts/package-runtime.sh \
            target/release/pam "${PAM_VERSION}" "${PAM_TARGET}" dist
      - name: Attest release archive
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: pam-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  build-macos:
    needs: release-preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - name: Validate tag matches the runtime version
        env:
          PAM_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: scripts/package-release.sh validate-tag "${PAM_RELEASE_TAG}"
      - name: Check out the pinned PAM Native SDK
        uses: actions/checkout@v5
        with:
          repository: push-in/pam-native
          ref: 5f42c2a5ba2c16bf4d487ee98de7b7eb4d90390a
          path: pam-native
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          key: pam-release-${{ matrix.target }}
      - name: Build verified iOS and macOS PHP runtimes
        env:
          PAM_RUNTIME_SLICE: ${{ matrix.target == 'macos-arm64' && 'all' || 'macos' }}
        run: |
          runtime-builder/ios/build.sh --php 8.4 "${PAM_RUNTIME_SLICE}"
          runtime-builder/ios/build.sh --php 8.5 "${PAM_RUNTIME_SLICE}"
      - name: Build PAM for macOS
        env:
          PAM_UPDATE_SIGNING_IDENTITY_SHA256: ${{ vars.PAM_DISTRIBUTION_EVIDENCE_KEY_SHA256 }}
          PAM_UPDATE_NEXT_SIGNING_IDENTITY_SHA256: ${{ vars.PAM_DISTRIBUTION_NEXT_EVIDENCE_KEY_SHA256 }}
        run: |
          printf '%s' "${PAM_UPDATE_SIGNING_IDENTITY_SHA256}" | grep -Eq '^[0-9a-f]{64}$'
          if test -n "${PAM_UPDATE_NEXT_SIGNING_IDENTITY_SHA256}"; then
            printf '%s' "${PAM_UPDATE_NEXT_SIGNING_IDENTITY_SHA256}" | grep -Eq '^[0-9a-f]{64}$'
            test "${PAM_UPDATE_NEXT_SIGNING_IDENTITY_SHA256}" != "${PAM_UPDATE_SIGNING_IDENTITY_SHA256}"
          fi
          php_config=$(find runtime/macos/8.5.* -type f -path '*/bin/php-config' -print -quit)
          test -n "${php_config}"
          php_sdk=$(dirname "$(dirname "${php_config}")")
          PHP_CONFIG="${php_config}" \
          PAM_PHP_LIB_DIR="${php_sdk}/lib" \
            cargo build --locked --release
          printf 'PAM_MACOS_PHP_SDK=%s\n' "${php_sdk}" >>"${GITHUB_ENV}"
          actual_version=$(DYLD_LIBRARY_PATH="${php_sdk}/lib" target/release/pam --version)
          expected_tag='${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}'
          test "${actual_version}" = "pam ${expected_tag#v}"
      - name: Package relocatable macOS runtime
        env:
          PAM_TARGET: ${{ matrix.target }}
          PAM_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          mkdir -p dist
          scripts/package-runtime-macos.sh \
            target/release/pam "${PAM_MACOS_PHP_SDK}" \
            "${PAM_VERSION}" "${PAM_TARGET}" dist
          archive=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "${archive}"
          extract_root=${RUNNER_TEMP}/pam-macos-smoke
          mkdir -p "${extract_root}"
          tar -xzf "${archive}" -C "${extract_root}"
          "${extract_root}/pam-${PAM_VERSION}-${PAM_TARGET}/bin/pam-run" --version
      - name: Attest release archive
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v5
        with:
          name: pam-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  certify-runtime-distribution:
    name: Certify Linux and macOS runtime distributions
    needs: [build, build-macos]
    permissions:
      contents: read
      attestations: read
    uses: ./.github/workflows/runtime-distribution.yml
    with:
      current_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      current_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      evidence_key_identity: ${{ vars.PAM_DISTRIBUTION_EVIDENCE_KEY_SHA256 }}
    secrets:
      evidence_key: ${{ secrets.PAM_DISTRIBUTION_EVIDENCE_KEY }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    needs: [ecosystem-compatibility, android-runtime, build, build-macos, certify-runtime-distribution]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: pam-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: certification-runtime-distribution-linux-x86_64-${{ github.sha }}
          path: runtime-distribution-certification/linux-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: certification-runtime-distribution-linux-aarch64-${{ github.sha }}
          path: runtime-distribution-certification/linux-aarch64
      - uses: actions/download-artifact@v4
        with:
          name: certification-runtime-distribution-macos-x86_64-${{ github.sha }}
          path: runtime-distribution-certification/macos-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: certification-runtime-distribution-macos-arm64-${{ github.sha }}
          path: runtime-distribution-certification/macos-arm64
      - name: Package the signed clean-host certification
        env:
          PAM_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          for target in linux-x86_64 linux-aarch64 macos-x86_64 macos-arm64; do
            certification="runtime-distribution-certification/${target}"
            test -f "${certification}/distribution.json"
            cp "${certification}/distribution.json" \
              "dist/pam-${PAM_RELEASE_TAG}-${target}.update.json"
            archive="dist/pam-${PAM_RELEASE_TAG}-runtime-distribution-${target}.tar.gz"
            tar -C "${certification}" -czf "${archive}" .
            sha256sum "${archive}" >"${archive}.sha256"
          done
      - name: Package the user-mode installer
        run: |
          cp install.sh dist/install.sh
          (
            cd dist
            sha256sum install.sh > install.sh.sha256
          )
      - name: Attest the installer
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: dist/install.sh
      - name: Publish immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          PAM_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: gh release create "${PAM_RELEASE_TAG}" dist/* --repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag
