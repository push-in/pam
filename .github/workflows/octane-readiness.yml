name: PAM Octane readiness

# Long-running certification of PAM as a Laravel Octane server: laravel/octane's
# own suite, the Octane feature matrix on Laravel 12/13, an ecosystem app
# (Livewire, Inertia, Filament, Sanctum, Horizon, Reverb) compared with
# FrankenPHP, and the four-server benchmark. See packages/octane/READINESS.md.

on:
  workflow_dispatch:
    inputs:
      stages:
        description: 'Stages to run (suite matrix ecosystem bench)'
        default: 'suite matrix ecosystem'
  schedule:
    - cron: '17 4 * * 1'
  pull_request:
    paths:
      - 'packages/octane/**'
      - 'runtime/bootstrap.php'
      - 'runtime/laravel.php'
      - 'src/server.rs'
      - 'src/cluster.rs'
      - 'src/balance.rs'
      - '.github/workflows/octane-readiness.yml'

permissions:
  contents: read

concurrency:
  group: pam-octane-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    name: Readiness (${{ github.event.inputs.stages || 'suite matrix ecosystem' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      READINESS_WORK_DIR: ${{ github.workspace }}/.readiness
      SMOKE_SOFTWARE_GL: '1'   # hosted runners have no GPU
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - name: Install PHP Embed development package
        run: |
          .github/scripts/add-ondrej-php-ppa.sh
          sudo apt-get update
          sudo apt-get install -y libphp8.5-embed php8.5-dev php8.5-sqlite3 wrk
      - uses: Swatinem/rust-cache@v2
      - name: Build PAM from this revision
        env:
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: cargo build --release --bin pam
      - name: Package the build like a release runtime
        # The Embed SAPI from the PPA lacks CLI-only extensions such as pcntl
        # (Horizon, Reverb). Run the new binary inside the latest released
        # runtime, which bundles them, exactly as a release package does.
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://github.com/push-in/pam/releases/latest/download/install.sh -o "$RUNNER_TEMP/install.sh"
          PAM_INSTALL_DIR="$RUNNER_TEMP/pam" PAM_BIN_DIR="$RUNNER_TEMP/pam-bin" sh "$RUNNER_TEMP/install.sh"
          runtime=$(dirname "$(dirname "$(readlink -f "$RUNNER_TEMP/pam-bin/pam")")")
          cp target/release/pam "$runtime/bin/pam"
          echo "PAM=$runtime/bin/pam-run" >> "$GITHUB_ENV"
          "$runtime/bin/pam-run" --version
          "$runtime/bin/pam-run" -r 'exit(function_exists("pcntl_async_signals") ? 0 : 1);'
      - name: Lossless SO_REUSEPORT hand-over (recommended production setting)
        run: sudo sysctl -w net.ipv4.tcp_migrate_req=1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run readiness stages
        run: packages/octane/readiness/run-local.sh ${{ github.event.inputs.stages || 'suite matrix ecosystem' }}
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pam-octane-readiness
          path: .readiness/results
          retention-days: 30
