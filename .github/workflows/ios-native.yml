name: PAM Native iOS certification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - runtime/catalog.json
      - runtime-builder/ios/**
      - src/mobile.rs
      - src/commands.rs
      - pam-native/**
      - .github/workflows/ios-native.yml
  pull_request:
    paths:
      - runtime/catalog.json
      - runtime-builder/ios/**
      - src/mobile.rs
      - src/commands.rs
      - pam-native/**
      - .github/workflows/ios-native.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  runtime-host:
    name: ${{ matrix.profile }} runtime, generated host, and simulator build
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: php84-baseline
            php: '8.4'
            runtime_id: 8.4.23-r1
            ios_minimum: '15.0'
            plugins: share-extension health media
            foundation_extensions: PamShareExtension
            extensionkit_extensions: ''
            cache_salt: php84-v1
          - profile: php85-extensions
            php: '8.5'
            runtime_id: 8.5.8-r1
            ios_minimum: '18.0'
            plugins: share-extension health media widgets intents live-activities
            foundation_extensions: PamShareExtension PamWidgets PamLiveActivities
            extensionkit_extensions: PamAppIntents
            cache_salt: c185ac6aaf58e8d98e6197cf5e3f0a85dbe28a92
    env:
      PAM_CERTIFICATION_PLUGINS: ${{ matrix.plugins }}
      PAM_FOUNDATION_EXTENSIONS: ${{ matrix.foundation_extensions }}
      PAM_EXTENSIONKIT_EXTENSIONS: ${{ matrix.extensionkit_extensions }}
    steps:
      - uses: actions/checkout@v5
      - name: Check out the pinned PAM Native SDK
        uses: actions/checkout@v5
        with:
          repository: push-in/pam-native
          ref: 26a768c9a7e0137bda9fa7de23f46c9308de2839
          path: pam-native
          persist-credentials: false
      - name: Check out the iOS capability certification plugins
        uses: actions/checkout@v5
        with:
          repository: push-in/pam-native-share-extension
          ref: 662fa09b57dfd5aff0f9ed11f10026e09e291801
          path: certification-plugins/share-extension
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: push-in/pam-native-health
          ref: 3f3a72ce3ec663efc250ecfa7bae3a18062cc6dc
          path: certification-plugins/health
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: push-in/pam-native-media
          ref: 7fbb48c7eeff8a0303f4b90b91f82bce7c4db691
          path: certification-plugins/media
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: push-in/pam-native-widgets
          ref: b7d9106a1ba8a83af0be576ec863e72ea5b31ead
          path: certification-plugins/widgets
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: push-in/pam-native-intents
          ref: b32e2daae135cedd58d8dd7ed45e76410ceec4b4
          path: certification-plugins/intents
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: push-in/pam-native-live-activities
          ref: 48caf73cfcff6fea54d42d41a426e1777b62d303
          path: certification-plugins/live-activities
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          key: pam-native-ios-runtime
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Restore verified PHP/XCFramework runtime
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: |
            runtime/ios/${{ matrix.runtime_id }}
            runtime/macos/${{ matrix.runtime_id }}
          key: pam-ios-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime/catalog.json', 'runtime-builder/ios/build.sh', 'pam-native/Cargo.lock', 'pam-native/crates/**/Cargo.toml') }}-${{ matrix.cache_salt }}
      - name: Build verified PHP and engine XCFrameworks
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: runtime-builder/ios/build.sh --php "${{ matrix.php }}" all
      - name: Validate restored or built runtime
        run: |
          test -x "runtime/macos/${{ matrix.runtime_id }}/bin/php-config"
          test -f "runtime/macos/${{ matrix.runtime_id }}/lib/libphp.dylib"
          test -f "runtime/ios/${{ matrix.runtime_id }}/PamPhp.xcframework/Info.plist"
          test -f "runtime/ios/${{ matrix.runtime_id }}/PamNativeEngine.xcframework/Info.plist"
          test -f "runtime/ios/${{ matrix.runtime_id }}/runtime.json"
      - name: Save verified PHP/XCFramework runtime immediately
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            runtime/ios/${{ matrix.runtime_id }}
            runtime/macos/${{ matrix.runtime_id }}
          key: pam-ios-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime/catalog.json', 'runtime-builder/ios/build.sh', 'pam-native/Cargo.lock', 'pam-native/crates/**/Cargo.toml') }}-${{ matrix.cache_salt }}
      - name: Build PAM CLI
        run: |
          php_config="runtime/macos/${{ matrix.runtime_id }}/bin/php-config"
          test -x "${php_config}"
          php_sdk=$(dirname "$(dirname "${php_config}")")
          PHP_CONFIG="${php_config}" \
          PAM_PHP_LIB_DIR="${php_sdk}/lib" \
            cargo build --locked
          printf 'DYLD_LIBRARY_PATH=%s\n' "${php_sdk}/lib" >>"${GITHUB_ENV}"
      - name: Generate isolated iOS application fixture
        run: |
          fixture=${RUNNER_TEMP}/pam-ios-fixture
          target/debug/pam init "${fixture}" \
            --template mobile --platform ios \
            --name 'PAM App' --application-id app.pam.hello \
            --no-install --no-interaction
          jq --arg php "${{ matrix.php }}" --arg minimum "${{ matrix.ios_minimum }}" \
            '.runtime.php = $php | .ios.minimumVersion = $minimum' \
            "${fixture}/pam-native.json" >"${fixture}/pam-native.json.tmp"
          mv "${fixture}/pam-native.json.tmp" "${fixture}/pam-native.json"
          test "$(jq -r '.name' "${fixture}/pam-native.json")" = 'PAM App'
          test "$(jq -r '.applicationId' "${fixture}/pam-native.json")" = app.pam.hello
          test "$(jq -r '.runtime.php' "${fixture}/pam-native.json")" = "${{ matrix.php }}"
          test "$(jq -r '.ios.minimumVersion' "${fixture}/pam-native.json")" = "${{ matrix.ios_minimum }}"
          composer validate --working-dir="${fixture}" --strict
          composer install \
            --working-dir="${fixture}" --no-dev --no-interaction --prefer-dist --dry-run
          composer install \
            --working-dir="${fixture}" --no-dev --no-interaction --prefer-dist
          packages=()
          for plugin in ${PAM_CERTIFICATION_PLUGINS}; do
            composer config --working-dir="${fixture}" \
              "repositories.certification-${plugin}" \
              "{\"type\":\"path\",\"url\":\"${GITHUB_WORKSPACE}/certification-plugins/${plugin}\",\"options\":{\"symlink\":false}}"
            packages+=("pushinbr/pam-native-${plugin}:@dev")
          done
          composer require --working-dir="${fixture}" \
            "${packages[@]}" \
            --update-no-dev --no-interaction --prefer-dist --dry-run
          composer require --working-dir="${fixture}" \
            "${packages[@]}" \
            --update-no-dev --no-interaction --prefer-dist
          target/debug/pam mobile ios:doctor "${fixture}"
          target/debug/pam mobile ios:prepare "${fixture}"
          test -f "${fixture}/.pam-native/ios/App/PamNativeApp.xcodeproj/project.pbxproj"
          ! grep -R '__PAM_' "${fixture}/.pam-native/ios/App"
          grep -q 'PRODUCT_NAME = "PAM App"' \
            "${fixture}/.pam-native/ios/App/PamNativeApp.xcodeproj/project.pbxproj"
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = app.pam.hello' \
            "${fixture}/.pam-native/ios/App/PamNativeApp.xcodeproj/project.pbxproj"
          grep -q 'NSCameraUsageDescription' "${fixture}/.pam-native/ios/App/App/Info.plist"
          grep -q 'NSMicrophoneUsageDescription' "${fixture}/.pam-native/ios/App/App/Info.plist"
          grep -q 'com.apple.developer.healthkit' \
            "${fixture}/.pam-native/ios/App/App/PamNativeApp.entitlements"
          grep -q 'PamShareExtension' \
            "${fixture}/.pam-native/ios/App/PamNativeApp.xcodeproj/project.pbxproj"
          for extension in ${PAM_FOUNDATION_EXTENSIONS} ${PAM_EXTENSIONKIT_EXTENSIONS}; do
            grep -q "${extension}" \
              "${fixture}/.pam-native/ios/App/PamNativeApp.xcodeproj/project.pbxproj"
          done
          for extension in ${PAM_EXTENSIONKIT_EXTENSIONS}; do
            grep -q 'com.apple.appintents-extension' \
              "${fixture}/.pam-native/ios/App/Extensions/${extension}/Info.plist"
            grep -q 'com.apple.product-type.extensionkit-extension' \
              "${fixture}/.pam-native/ios/App/PamNativeApp.xcodeproj/project.pbxproj"
          done
          printf 'PAM_IOS_FIXTURE=%s\n' "${fixture}" >>"${GITHUB_ENV}"
      - name: Validate and build generated Xcode project
        run: |
          plutil -lint "${PAM_IOS_FIXTURE}/.pam-native/ios/App/App/Info.plist"
          xcodebuild \
            -project "${PAM_IOS_FIXTURE}/.pam-native/ios/App/PamNativeApp.xcodeproj" \
            -scheme PamNativeApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${PAM_IOS_FIXTURE}/.pam-native/ios/App/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
          test -d "${PAM_IOS_FIXTURE}/.pam-native/ios/App/DerivedData/Build/Products/Debug-iphonesimulator/PAM App.app"
          products="${PAM_IOS_FIXTURE}/.pam-native/ios/App/DerivedData/Build/Products/Debug-iphonesimulator"
          for extension in ${PAM_FOUNDATION_EXTENSIONS}; do
            test -d "${products}/${extension}.appex"
            test -d "${products}/PAM App.app/PlugIns/${extension}.appex"
          done
          for extension in ${PAM_EXTENSIONKIT_EXTENSIONS}; do
            test -d "${products}/${extension}.appex"
            test -d "${products}/PAM App.app/Extensions/${extension}.appex"
          done
      - name: Install, launch, and certify the generated app
        run: |
          simulator=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              for device in devices[runtime]:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator")
          ')
          state=$(xcrun simctl list devices --json | python3 -c '
          import json, sys
          wanted = sys.argv[1]
          for devices in json.load(sys.stdin)["devices"].values():
              for device in devices:
                  if device.get("udid") == wanted:
                      print(device.get("state", ""))
                      raise SystemExit(0)
          ' "${simulator}")
          if test "${state}" != Booted; then
            xcrun simctl boot "${simulator}"
          fi
          xcrun simctl bootstatus "${simulator}" -b
          target/debug/pam mobile ios:run "${PAM_IOS_FIXTURE}"
          app_container=$(xcrun simctl get_app_container "${simulator}" app.pam.hello app)
          test -d "${app_container}"
          launch=$(xcrun simctl launch --terminate-running-process "${simulator}" app.pam.hello)
          pid=${launch##*: }
          sleep 5
          xcrun simctl io "${simulator}" screenshot \
            "${RUNNER_TEMP}/pam-ios-fixture/simulator.png" || true
          xcrun simctl spawn "${simulator}" log show \
            --style compact --debug --last 5m \
            --predicate 'process == "PAM App" OR eventMessage CONTAINS[c] "app.pam.hello"' \
            >"${RUNNER_TEMP}/pam-ios-fixture/simulator.log" || true
          crash_source="${HOME}/Library/Developer/CoreSimulator/Devices/${simulator}/data/Library/Logs/CrashReporter"
          if test -d "${crash_source}"; then
            mkdir -p "${RUNNER_TEMP}/pam-ios-fixture/crashes"
            cp -R "${crash_source}/." "${RUNNER_TEMP}/pam-ios-fixture/crashes/"
          fi
          host_crashes="${HOME}/Library/Logs/DiagnosticReports"
          if test -d "${host_crashes}"; then
            mkdir -p "${RUNNER_TEMP}/pam-ios-fixture/crashes/host"
            find "${host_crashes}" -type f -mmin -10 \
              \( -name 'PAM App*' -o -name '*app.pam.hello*' \) \
              -exec cp {} "${RUNNER_TEMP}/pam-ios-fixture/crashes/host/" \;
          fi
          if ! ps -p "${pid}" >/dev/null; then
            debug_launch=$(xcrun simctl launch --terminate-running-process \
              --wait-for-debugger "${simulator}" app.pam.hello)
            debug_pid=${debug_launch##*: }
            perl -e '$seconds = shift; alarm $seconds; exec @ARGV' 60 \
              lldb --batch \
              -o "process attach --pid ${debug_pid}" \
              -o 'process handle SIGBUS --stop true --notify true --pass false' \
              -o continue \
              -k 'thread backtrace all' \
              >"${RUNNER_TEMP}/pam-ios-fixture/lldb.log" 2>&1 || true
            exit 1
          fi
          ! grep -E 'Pam Native failed to start|PHP (fatal|parse) error' \
            "${RUNNER_TEMP}/pam-ios-fixture/simulator.log"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: pam-native-ios-generated-host-${{ matrix.profile }}
          path: |
            ${{ runner.temp }}/pam-ios-fixture/.pam-native/ios/App/PamNativeApp.xcodeproj
            ${{ runner.temp }}/pam-ios-fixture/.pam-native/ios/App/DerivedData/Logs
            ${{ runner.temp }}/pam-ios-fixture/simulator.png
            ${{ runner.temp }}/pam-ios-fixture/simulator.log
            ${{ runner.temp }}/pam-ios-fixture/lldb.log
            ${{ runner.temp }}/pam-ios-fixture/crashes
          if-no-files-found: warn
