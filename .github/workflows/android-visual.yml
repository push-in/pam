name: Android Product visual evidence

# The Product template from this checkout, on the released PAM toolchain and the
# PAM Native and PAM Native UI versions it pins from Packagist, on an Android 36
# emulator (pixel_6): light and dark captures, pixel geometry
# (pam-native-ui tools/geometry.py) and goldens
# (tests/golden/product/android, pam-native-ui tools/golden.py).

on:
  workflow_call:
    inputs:
      record_goldens:
        type: boolean
        default: false
  pull_request:
    paths:
      - src/commands.rs
      - tests/golden/product/**
      - scripts/product-golden.py
      - .github/scripts/product-visual-android.sh
      - .github/workflows/android-visual.yml
  workflow_dispatch:
    inputs:
      record_goldens:
        description: Record goldens instead of comparing (uploaded as an artifact)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pam-android-product-visual-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  product-visual:
    name: Product light and dark captures on Android API 36
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Pins the geometry and golden tools; the app gets PAM Native UI from Packagist.
      PAM_NATIVE_UI_REF: v2.2.0
      PAM_PRODUCT_APPLICATION_ID: app.pam.productvisual
      PAM_PRODUCT_PACKAGE: app.pam.productvisual.debug
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Check out the PAM Native UI geometry and golden tools
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: push-in/pam-native-ui
          ref: ${{ env.PAM_NATIVE_UI_REF }}
          path: pam-native-ui
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
      - uses: dtolnay/rust-toolchain@5445741acf05630efa19e221cc588ebe0842b13d # 1.88.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android-product-visual
      - name: Install Android build dependencies
        run: |
          # Retries a corrupt or truncated SDK download instead of failing the job.
          for attempt in 1 2 3; do
            sdkmanager 'platforms;android-36' 'ndk;27.1.12297006' 'cmake;3.22.1' && break
            test "${attempt}" = 3 && exit 1
            sleep 20
          done
      - name: Install the released PAM toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # github.com release downloads answer 403 now and then on hosted runners,
          # and the anonymous GitHub API is rate limited: resolve the tag with the
          # job token and retry the download.
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 15 -o /tmp/pam-install.sh \
            https://github.com/push-in/pam/releases/latest/download/install.sh
          PAM_VERSION=$(gh release view -R push-in/pam --json tagName -q .tagName)
          export PAM_VERSION
          for attempt in 1 2 3; do sh /tmp/pam-install.sh && break; test "${attempt}" = 3 && exit 1; sleep 30; done
          echo "${HOME}/.local/bin" >>"${GITHUB_PATH}"
      - name: Build the PAM CLI from this checkout (the Product template under test)
        run: cargo build --locked
      - name: Generate the Product workspace and build its debug app
        run: |
          fixture=${RUNNER_TEMP}/pam-product-visual
          target/debug/pam init "${fixture}" \
            --template product \
            --name 'PAM Product Visual' \
            --application-id "${PAM_PRODUCT_APPLICATION_ID}" \
            --no-install --no-interaction
          cd "${fixture}/apps/native"
          # Resolve first: a template pin that Packagist cannot satisfy fails here.
          for attempt in 1 2 3; do
            pam composer install --no-interaction --no-progress --prefer-dist --dry-run && break
            test "${attempt}" = 3 && exit 1
            sleep 20
          done
          for attempt in 1 2 3; do
            pam composer install --no-interaction --no-progress --prefer-dist && break
            test "${attempt}" = 3 && exit 1
            sleep 20
          done
          # The screen renders on the host before it reaches a device.
          pam composer test
          # The theme file is the one the token contract generates.
          php ../../packages/contracts/bin/theme-css.php | cmp - src/theme.css
          mkdir -p "${fixture}/artifacts" artifacts/screenshots
          timeout 300 pam audit . --json >"${fixture}/artifacts/android-release-audit.json"
          test "$(jq -r '.resultCode' "${fixture}/artifacts/android-release-audit.json")" = 1
          pam mobile build . --abi x86_64
          apk=$(find dist -name '*.apk' | head -n 1)
          test -s "${apk}"
          printf 'PAM_PRODUCT_FIXTURE=%s\nPAM_PRODUCT_APK=%s\n' "${fixture}" "${fixture}/apps/native/${apk}" >>"${GITHUB_ENV}"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture, measure and compare the real Product app
        # v2.38.0, pinned to the verified release commit.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          RECORD_GOLDENS: ${{ inputs.record_goldens && '1' || '' }}
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash .github/scripts/product-visual-android.sh
      - name: Keep the bounded Android logs
        if: always()
        run: |
          fixture=${PAM_PRODUCT_FIXTURE:-${RUNNER_TEMP}/pam-product-visual}
          mkdir -p "${fixture}/artifacts"
          # The capture script saved the logs while the emulator ran; the
          # emulator is gone now, so adb must not wait for it.
          if ! test -s "${fixture}/artifacts/android-logcat.txt"; then
            echo 'no emulator log was captured' >"${fixture}/artifacts/android-logcat.txt"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: pam-product-android-visual-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pam-product-visual/apps/native/artifacts/screenshots/product-native-light.png
            ${{ runner.temp }}/pam-product-visual/apps/native/artifacts/screenshots/product-native-dark.png
            ${{ runner.temp }}/pam-product-visual/artifacts/android-captures.sha256
            ${{ runner.temp }}/pam-product-visual/artifacts/android-release-audit.json
            ${{ runner.temp }}/pam-product-visual/artifacts/android-logcat.txt
            ${{ runner.temp }}/pam-product-visual/artifacts/geometry-*.json
            ${{ runner.temp }}/pam-product-visual/artifacts/golden-*.png
            ${{ runner.temp }}/pam-product-visual/packages/contracts/design-tokens.json
          if-no-files-found: error
          retention-days: 30
