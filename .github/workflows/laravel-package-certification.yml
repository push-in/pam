name: Laravel package certification

on:
  schedule:
    - cron: '41 3 * * 2'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'compatibility/laravel-packages.json'
      - 'compat/certification/**'
      - 'packages/laravel/**'
      - 'scripts/certify-laravel-package.sh'
      - '.github/workflows/laravel-package-certification.yml'

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.matrix.outputs.packages }}
    steps:
      - uses: actions/checkout@v5
      - id: matrix
        run: |
          printf 'packages=%s\n' "$(
            jq -c '{
              include: [
                .packages[]
                | select(.status != 3)
                | . as $package
                | .laravel[]
                | {
                    package: $package.name,
                    constraint: $package.constraint,
                    status: $package.status,
                    laravel: tostring
                  }
              ]
            }' compatibility/laravel-packages.json
          )" >>"${GITHUB_OUTPUT}"

  certify:
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: ${{ matrix.status == 2 }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.matrix.outputs.packages) }}
    name: ${{ matrix.package }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pcntl, pdo_sqlite, sockets, xml, zip
          tools: composer:v2
      - name: Install PHP Embed toolchain
        run: |
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install -y libphp8.4-embed php8.4-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-certification-${{ matrix.laravel }}
      - name: Build PAM
        run: cargo build --locked --release
      - name: Certify package on persistent PAM workers
        env:
          PAM_CERTIFICATION_RESULTS: ${{ runner.temp }}/certification
        run: |
          mkdir -p "${PAM_CERTIFICATION_RESULTS}"
          set +e
          scripts/certify-laravel-package.sh \
            '${{ matrix.package }}' \
            '${{ matrix.constraint }}' \
            '${{ matrix.laravel }}'
          certification_status=$?
          set -e
          if [ "${certification_status}" -ne 0 ]; then
            jq -n \
              --arg package '${{ matrix.package }}' \
              --argjson laravel '${{ matrix.laravel }}' \
              --argjson status 3 \
              --arg certified_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{
                schema: 1,
                package: $package,
                laravel: $laravel,
                status: $status,
                checks: {certification_completed: false},
                certified_at: $certified_at
              }' >"${PAM_CERTIFICATION_RESULTS}/${{ strategy.job-index }}-failed.json"
          fi
          exit "${certification_status}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certification-${{ strategy.job-index }}
          path: ${{ runner.temp }}/certification/*.json
          if-no-files-found: error

  registry:
    needs: certify
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: certification-*
          path: certification-results
          merge-multiple: true
      - name: Build auditable certification bundle
        run: |
          find certification-results -type f -name '*.json' -print0 |
            sort -z |
            xargs -0 jq -s 'sort_by(.package, .laravel)' > certification-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: laravel-package-certification
          path: certification-results.json
          if-no-files-found: error
