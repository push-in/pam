version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-runtime:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      fuzz:
        patterns:
          - "*"

  - package-ecosystem: composer
    directory: /packages/nimbus
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nimbus-production:
        dependency-type: production
      nimbus-development:
        dependency-type: development

  - package-ecosystem: composer
    directories:
      - /packages/http-psr
      - /packages/http-testing
      - /packages/nimbus-rector
      - /packages/skeleton
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # First-party constraints move with the release (RELEASE.md).
      - dependency-name: "pushinbr/*"
    groups:
      packages:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /
      - /packages/skeleton
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: composer
    directory: /packages/octane
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      octane-production:
        dependency-type: production
      octane-development:
        dependency-type: development

  - package-ecosystem: github-actions
    directories:
      - /
      - /packages/nimbus
      - /packages/http-psr
      - /packages/http-testing
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
