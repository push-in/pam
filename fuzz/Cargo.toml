[package]
name = "pam-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
bytes = "=1.12.1"
http = "=1.4.2"
libfuzzer-sys = "=0.4.13"
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[[bin]]
name = "dispatch_envelope"
path = "fuzz_targets/dispatch_envelope.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[[bin]]
name = "page_cache_policy"
path = "fuzz_targets/page_cache_policy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shared_table"
path = "fuzz_targets/shared_table.rs"
test = false
doc = false
bench = false
