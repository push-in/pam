[package]
name = "pam-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "http2", "tokio"] }
bytes = "=1.12.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "=1.4.2"
http-body-util = "=0.1.4"
hyper = { version = "=1.11.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "=0.1.20", features = ["http1", "http2", "server-auto", "service", "tokio"] }
libfuzzer-sys = "=0.4.13"
libc = "=0.2.189"
memchr = "=2.8.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tokio = { version = "=1.54.1", features = ["fs", "io-util", "macros", "rt", "time"] }

[build-dependencies]
cc = "=1.3.0"

[[bin]]
name = "dispatch_envelope"
path = "fuzz_targets/dispatch_envelope.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[[bin]]
name = "page_cache_policy"
path = "fuzz_targets/page_cache_policy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shared_table"
path = "fuzz_targets/shared_table.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_request"
path = "fuzz_targets/http_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "multipart"
path = "fuzz_targets/multipart.rs"
test = false
doc = false
bench = false

[[bin]]
name = "native_headers"
path = "fuzz_targets/native_headers.rs"
test = false
doc = false
bench = false
