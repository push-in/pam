[package]
name = "pam-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
bytes = "=1.12.1"
libfuzzer-sys = "=0.4.13"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[[bin]]
name = "dispatch_envelope"
path = "fuzz_targets/dispatch_envelope.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
