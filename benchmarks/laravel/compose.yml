name: pam-laravel-benchmark

x-app-environment: &app-environment
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  DB_CONNECTION: sqlite
  DB_DATABASE: ":memory:"
  CACHE_STORE: array
  SESSION_DRIVER: array
  LOG_CHANNEL: stderr
  TELESCOPE_ENABLED: "false"
  PULSE_ENABLED: "false"
  PAM_LARAVEL_OBSERVABILITY: "false"
  PAM_STATE_GUARD: "false"

x-limits: &limits
  cpus: 2.0
  cpuset: "${PAM_BENCH_APP_CPUSET:-0,1}"
  mem_limit: 1024m
  pids_limit: 512

x-fpm-limits: &fpm-limits
  cpus: 1.75
  cpuset: "${PAM_BENCH_APP_CPUSET:-0,1}"
  mem_limit: 896m
  pids_limit: 448

x-proxy-limits: &proxy-limits
  cpus: 0.25
  cpuset: "${PAM_BENCH_APP_CPUSET:-0,1}"
  mem_limit: 128m
  pids_limit: 64

services:
  fpm:
    <<: *fpm-limits
    build:
      context: ../..
      dockerfile: benchmarks/laravel/Dockerfile
      target: fpm
    environment: *app-environment

  nginx:
    <<: *proxy-limits
    image: nginx:1.29.0-alpine
    depends_on:
      - fpm
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../compat/laravel-smoke/public:/workspace/compat/laravel-smoke/public:ro

  octane:
    <<: *limits
    build:
      context: ../..
      dockerfile: benchmarks/laravel/Dockerfile
      target: octane
    environment: *app-environment
    command:
      - php
      - artisan
      - octane:start
      - --server=swoole
      - --host=0.0.0.0
      - --port=8080
      - --workers=4
      - --task-workers=0
      - --max-requests=10000
    ports:
      - "127.0.0.1:18081:8080"

  frankenphp:
    <<: *limits
    build:
      context: ../..
      dockerfile: benchmarks/laravel/Dockerfile
      target: frankenphp
    environment: *app-environment
    entrypoint: ["php"]
    command:
      - artisan
      - octane:frankenphp
      - --host=0.0.0.0
      - --port=8080
      - --workers=4
      - --max-requests=10000
    ports:
      - "127.0.0.1:18082:8080"

  roadrunner:
    <<: *limits
    build:
      context: ../..
      dockerfile: benchmarks/laravel/Dockerfile
      target: roadrunner
    environment: *app-environment
    command:
      - php
      - artisan
      - octane:start
      - --server=roadrunner
      - --host=0.0.0.0
      - --port=8080
      - --workers=4
      - --max-requests=10000
    ports:
      - "127.0.0.1:18083:8080"
